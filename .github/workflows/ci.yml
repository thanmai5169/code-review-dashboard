name: CodeLens CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package*.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/codelens_test
          JWT_SECRET: ci_test_jwt_secret_key_12345
        run: npm test

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package*.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: ./client
        run: npm run build
