version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: codelens_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=codelens
    volumes:
      - mongodb_data:/data/db
    networks:
      - codelens_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codelens_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/codelens
      - JWT_SECRET=codelens_production_jwt_secret_key_change_in_prod
      - CLIENT_URL=http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:5000/api/auth/github/callback}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - codelens_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codelens_client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - codelens_network

volumes:
  mongodb_data:
    driver: local

networks:
  codelens_network:
    driver: bridge
